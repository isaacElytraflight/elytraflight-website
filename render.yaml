services:
  - type: web
    name: elytraflight-website
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /CS180Proj0
        destination: /CS180Proj0/index.html
      - type: rewrite
        source: /*
        destination: /index.html
