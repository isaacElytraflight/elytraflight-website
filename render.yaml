services:
  - type: web
    name: elytraflight-website
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    routes:
      - type: redirect
        source: /CS180Proj0
        destination: /CS180Proj0/
        status: 301
      - type: redirect
        source: /CS180Proj1
        destination: /CS180Proj1/
        status: 301
      - type: rewrite
        source: /*
        destination: /index.html

